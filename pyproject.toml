[project]
name = "rag-against-the-machine"
version = "0.1.0"
description = "Retrieval-Augmented Generation system over the vLLM codebase"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fire>=0.7.1",
    "huggingface-hub>=1.32.0",
    "pydantic>=2.14.1",
    "torch>=2.14.0",
    "transformers>=5.17.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "flake8>=7.4.1",
    "mypy>=2.3.1",
]
